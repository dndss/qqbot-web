<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f8" />
    <title>QQ Bot 消息工作台</title>
    <link rel="stylesheet" href="/styles.css?v=11" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <strong>QQ Bot</strong>
            <span>官方消息工作台</span>
          </div>
          <button id="settings-button" class="icon-button" title="机器人设置" aria-label="机器人设置">⚙</button>
        </header>

        <div class="account-toolbar">
          <select id="account-select" aria-label="当前 Bot 账号"></select>
          <button id="add-account-button" class="icon-button" type="button" title="添加 Bot" aria-label="添加 Bot">＋</button>
        </div>

        <div class="connection-card">
          <span id="status-dot" class="status-dot"></span>
          <div>
            <strong id="status-label">未连接</strong>
            <span id="status-detail">请配置官方机器人</span>
          </div>
          <button id="connection-button" class="small-button">连接</button>
        </div>

        <div class="search-wrap">
          <span>⌕</span>
          <input id="search-input" type="search" placeholder="搜索会话" autocomplete="off" />
        </div>
        <nav id="conversation-list" class="conversation-list" aria-label="会话列表"></nav>
      </aside>

      <section class="chat-panel">
        <div id="empty-state" class="empty-state">
          <div class="empty-logo">Q</div>
          <h1>QQ Bot 消息工作台</h1>
          <p>连接机器人后，收到的群聊和 C2C 私聊消息会出现在这里。</p>
          <button id="empty-settings-button" class="primary-button">配置机器人</button>
        </div>

        <div id="chat-view" class="chat-view hidden">
          <header class="chat-header">
            <div>
              <h1 id="chat-title"></h1>
              <p id="chat-subtitle"></p>
            </div>
            <span id="chat-type" class="type-badge"></span>
          </header>
          <div id="message-list" class="message-list" aria-live="polite"></div>
          <form id="composer" class="composer">
            <div id="reply-preview" class="reply-preview hidden">
              <div>
                <strong id="reply-preview-label"></strong>
                <span id="reply-preview-content"></span>
              </div>
              <button id="cancel-reply" class="icon-button" type="button" aria-label="取消回复">×</button>
            </div>
            <div class="composer-toolbar" aria-label="消息工具栏">
              <select id="message-type" class="visually-hidden" aria-label="消息类型">
                <option value="text">普通消息</option>
                <option value="markdown">Markdown</option>
                <option value="image">图片</option>
                <option value="video">视频</option>
                <option value="audio">语音</option>
                <option value="file">文件</option>
              </select>
              <div class="media-tool" data-media-type="image">
                <button class="media-tool-main" type="button" data-media-action="local" data-media-type="image" aria-label="上传本地图片" title="上传本地图片">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>
                </button>
                <button class="media-tool-more" type="button" data-media-action="url" data-media-type="image" aria-label="通过 URL 发送图片" title="通过 URL 发送图片">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                </button>
              </div>
              <div class="media-tool" data-media-type="video">
                <button class="media-tool-main" type="button" data-media-action="local" data-media-type="video" aria-label="上传本地视频" title="上传本地视频">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></svg>
                </button>
                <button class="media-tool-more" type="button" data-media-action="url" data-media-type="video" aria-label="通过 URL 发送视频" title="通过 URL 发送视频">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                </button>
              </div>
              <div class="media-tool" data-media-type="audio">
                <button class="media-tool-main" type="button" data-media-action="local" data-media-type="audio" aria-label="上传本地语音" title="上传本地语音">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
                </button>
                <button class="media-tool-more" type="button" data-media-action="url" data-media-type="audio" aria-label="通过 URL 发送语音" title="通过 URL 发送语音">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                </button>
              </div>
              <div class="media-tool" data-media-type="file">
                <button class="media-tool-main" type="button" data-media-action="local" data-media-type="file" aria-label="上传本地文件" title="上传本地文件">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a3 3 0 0 1 3-3h4l2 3h6a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z"/></svg>
                </button>
                <button class="media-tool-more" type="button" data-media-action="url" data-media-type="file" aria-label="通过 URL 发送文件" title="通过 URL 发送文件">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                </button>
              </div>
              <span id="composer-mode-badge" class="composer-mode-badge">普通消息</span>
            </div>
            <textarea id="message-input" rows="1" maxlength="2000" placeholder="输入普通消息，Enter 发送，Shift + Enter 换行"></textarea>
            <div id="media-inputs" class="media-inputs hidden">
              <div id="media-url-row" class="media-url-row hidden">
                <span id="media-url-label">图片 URL</span>
                <input id="media-url" type="url" maxlength="2000" placeholder="输入公网 HTTPS/HTTP 地址">
                <button id="cancel-media-url" class="attachment-remove" type="button" aria-label="取消 URL 附件">×</button>
              </div>
              <div id="attachment-chip" class="attachment-chip hidden">
                <span id="attachment-icon" class="attachment-icon">▣</span>
                <div>
                  <strong id="media-file-name">未选择文件</strong>
                  <small id="attachment-meta"></small>
                </div>
                <button id="cancel-attachment" class="attachment-remove" type="button" aria-label="移除附件">×</button>
              </div>
              <input id="media-file" class="visually-hidden" type="file">
            </div>
            <div class="composer-footer">
              <span id="composer-hint">普通消息支持纯文本或文本 + 一张图片</span>
              <div class="send-control">
                <button id="send-button" class="send-main" type="submit">发送</button>
                <button id="send-options-button" class="send-more" type="button" aria-label="发送设置" aria-expanded="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
                </button>
                <div id="send-options-menu" class="send-options-menu hidden" role="menu">
                  <span class="send-menu-heading">消息格式</span>
                  <button type="button" data-message-format="text"><span>普通消息</span><i>✓</i></button>
                  <button type="button" data-message-format="markdown"><span>Markdown</span><i>✓</i></button>
                  <span class="send-menu-separator"></span>
                  <span class="send-menu-heading">快捷键</span>
                  <button type="button" data-send-shortcut="enter"><span>Enter 发送</span><i>✓</i></button>
                  <button type="button" data-send-shortcut="ctrl-enter"><span>Ctrl+Enter 发送</span><i>✓</i></button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </section>

      <aside id="detail-panel" class="detail-panel">
        <div class="detail-heading">
          <h2>会话详情</h2>
          <button id="refresh-bot-state" class="small-button hidden" type="button">刷新状态</button>
        </div>
        <div class="detail-avatar" id="detail-avatar">Q</div>
        <strong id="detail-title">尚未选择会话</strong>
        <span id="detail-subtitle">—</span>
        <dl id="detail-list" class="detail-list"></dl>
        <div class="protocol-note">
          <strong>官方协议说明</strong>
          <p>这里只展示机器人实际收到并保存的消息，不会同步个人 QQ 好友或历史记录。</p>
        </div>
      </aside>
    </main>

    <dialog id="settings-dialog">
      <form id="settings-form" class="settings-form">
        <div class="dialog-header">
          <div>
            <h2 id="settings-title">机器人设置</h2>
            <p>凭据仅保存在当前服务端，不会返回浏览器。</p>
          </div>
          <button id="close-settings" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <input id="account-id-input" name="accountId" type="hidden" />
        <label>
          <span>显示名称</span>
          <input id="account-name-input" name="name" autocomplete="off" placeholder="例如：客服机器人" />
        </label>
        <label>
          <span>AppID</span>
          <input id="appid-input" name="appid" required autocomplete="off" placeholder="QQ 开放平台 AppID" />
        </label>
        <label>
          <span>App Secret</span>
          <input id="secret-input" name="secret" type="password" autocomplete="new-password" placeholder="留空则保持现有 Secret" />
          <small id="secret-hint"></small>
        </label>
        <label class="checkbox-label">
          <input id="sandbox-input" name="sandbox" type="checkbox" />
          <span>使用沙箱环境</span>
        </label>
        <div id="settings-error" class="form-error"></div>
        <div class="dialog-actions">
          <button id="delete-account" class="danger-button hidden" type="button">删除账号</button>
          <span class="dialog-spacer"></span>
          <button id="cancel-settings" class="secondary-button" type="button">取消</button>
          <button class="primary-button" type="submit">保存并连接</button>
        </div>
      </form>
    </dialog>

    <div id="context-menu" class="context-menu hidden" role="menu"></div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js?v=11"></script>
  </body>
</html>
