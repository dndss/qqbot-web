<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f8" />
    <title>QQ Bot 消息工作台</title>
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark">Q</div>
          <div>
            <strong>QQ Bot</strong>
            <span>官方消息工作台</span>
          </div>
          <button id="settings-button" class="icon-button" title="机器人设置" aria-label="机器人设置">⚙</button>
        </header>

        <div class="account-toolbar">
          <select id="account-select" aria-label="当前 Bot 账号"></select>
          <button id="add-account-button" class="icon-button" type="button" title="添加 Bot" aria-label="添加 Bot">＋</button>
        </div>

        <div class="connection-card">
          <span id="status-dot" class="status-dot"></span>
          <div>
            <strong id="status-label">未连接</strong>
            <span id="status-detail">请配置官方机器人</span>
          </div>
          <button id="connection-button" class="small-button">连接</button>
        </div>

        <div class="search-wrap">
          <span>⌕</span>
          <input id="search-input" type="search" placeholder="搜索会话" autocomplete="off" />
        </div>
        <nav id="conversation-list" class="conversation-list" aria-label="会话列表"></nav>
      </aside>

      <section class="chat-panel">
        <div id="empty-state" class="empty-state">
          <div class="empty-logo">Q</div>
          <h1>QQ Bot 消息工作台</h1>
          <p>连接机器人后，收到的群聊和 C2C 私聊消息会出现在这里。</p>
          <button id="empty-settings-button" class="primary-button">配置机器人</button>
        </div>

        <div id="chat-view" class="chat-view hidden">
          <header class="chat-header">
            <div>
              <h1 id="chat-title"></h1>
              <p id="chat-subtitle"></p>
            </div>
            <span id="chat-type" class="type-badge"></span>
          </header>
          <div id="message-list" class="message-list" aria-live="polite"></div>
          <form id="composer" class="composer">
            <div id="reply-preview" class="reply-preview hidden">
              <div>
                <strong id="reply-preview-label"></strong>
                <span id="reply-preview-content"></span>
              </div>
              <button id="cancel-reply" class="icon-button" type="button" aria-label="取消回复">×</button>
            </div>
            <textarea id="message-input" rows="1" maxlength="2000" placeholder="输入 Markdown 消息，Enter 发送，Shift + Enter 换行"></textarea>
            <div class="composer-footer">
              <span id="composer-hint">官方协议的主动消息能力可能受限</span>
              <button id="send-button" class="primary-button" type="submit">发送</button>
            </div>
          </form>
        </div>
      </section>

      <aside id="detail-panel" class="detail-panel">
        <div class="detail-heading">
          <h2>会话详情</h2>
          <button id="refresh-bot-state" class="small-button hidden" type="button">刷新状态</button>
        </div>
        <div class="detail-avatar" id="detail-avatar">Q</div>
        <strong id="detail-title">尚未选择会话</strong>
        <span id="detail-subtitle">—</span>
        <dl id="detail-list" class="detail-list"></dl>
        <div class="protocol-note">
          <strong>官方协议说明</strong>
          <p>这里只展示机器人实际收到并保存的消息，不会同步个人 QQ 好友或历史记录。</p>
        </div>
      </aside>
    </main>

    <dialog id="settings-dialog">
      <form id="settings-form" class="settings-form">
        <div class="dialog-header">
          <div>
            <h2 id="settings-title">机器人设置</h2>
            <p>凭据仅保存在当前服务端，不会返回浏览器。</p>
          </div>
          <button id="close-settings" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <input id="account-id-input" name="accountId" type="hidden" />
        <label>
          <span>显示名称</span>
          <input id="account-name-input" name="name" autocomplete="off" placeholder="例如：客服机器人" />
        </label>
        <label>
          <span>AppID</span>
          <input id="appid-input" name="appid" required autocomplete="off" placeholder="QQ 开放平台 AppID" />
        </label>
        <label>
          <span>App Secret</span>
          <input id="secret-input" name="secret" type="password" autocomplete="new-password" placeholder="留空则保持现有 Secret" />
          <small id="secret-hint"></small>
        </label>
        <label class="checkbox-label">
          <input id="sandbox-input" name="sandbox" type="checkbox" />
          <span>使用沙箱环境</span>
        </label>
        <div id="settings-error" class="form-error"></div>
        <div class="dialog-actions">
          <button id="delete-account" class="danger-button hidden" type="button">删除账号</button>
          <span class="dialog-spacer"></span>
          <button id="cancel-settings" class="secondary-button" type="button">取消</button>
          <button class="primary-button" type="submit">保存并连接</button>
        </div>
      </form>
    </dialog>

    <div id="context-menu" class="context-menu hidden" role="menu"></div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js?v=7"></script>
  </body>
</html>
